<title>Gantt Terminplaner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Aufbau: Kopfleiste mit Einstellungen, darunter links die Vorgangstabelle und rechts die Zeitachse.
   Beide Seiten teilen Zeilenhöhe und vertikalen Scroll, damit jede Zeile ihrem Balken entspricht. */
:root {
  --bg: #f1f4f2;
  --surface: #ffffff;
  --ink: #16231d;
  --muted: #5a6a62;
  --line: #d3dbd6;
  --grid: #e4e9e6;
  --hdr: #e6ece8;
  --accent: #26664b; --accent-2: #7cc29c;
  --accent-ink: #ffffff;
  --accent-soft: #dcebe3;
  --sumrow: #e9f0ec;
  --sel: #e3efe8;
  --bar-sum: #1d3b2e;
  --bar-task: #3d7e5e;
  --bar-sub: #94c4aa;
  --bar-ms: #d4861b;
  --link: #b23a2b;
  --today: #1f6feb;
  --today-bg: #e2ecfb;
  --weekend: #eaeeec;
  --holiday: #f3dcd8;
  --warn: #b23a2b;
  --on-task: #ffffff;
  --on-sub: #16231d;
  --st-arbeit-bg: #fbe8c8;
  --st-arbeit: #7a4a06;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --rowh: 34px;
  --headh: 72px;
  --leftw: 56%;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111916; --surface: #18221d; --ink: #e5eee9; --muted: #92a39a; --line: #2c3a33; --grid: #232f29;
    --hdr: #1d2924; --accent: #5db58d; --accent-2: #1f5a40; --accent-ink: #0d1f17; --accent-soft: #23372d; --sumrow: #1c2923; --sel: #223329;
    --bar-sum: #a9d9c0; --bar-task: #55a57c; --bar-sub: #2f6a50; --bar-ms: #e3a23a; --link: #ea7968;
    --today: #6aa6ff; --today-bg: #1e2c44; --weekend: #1d2823; --holiday: #3b2724; --warn: #ea7968;
    --on-task: #0d1f17; --on-sub: #e5eee9; --st-arbeit-bg: #4a3512; --st-arbeit: #f3c77e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111916; --surface: #18221d; --ink: #e5eee9; --muted: #92a39a; --line: #2c3a33; --grid: #232f29;
  --hdr: #1d2924; --accent: #5db58d; --accent-2: #1f5a40; --accent-ink: #0d1f17; --accent-soft: #23372d; --sumrow: #1c2923; --sel: #223329;
  --bar-sum: #a9d9c0; --bar-task: #55a57c; --bar-sub: #2f6a50; --bar-ms: #e3a23a; --link: #ea7968;
  --today: #6aa6ff; --today-bg: #1e2c44; --weekend: #1d2823; --holiday: #3b2724; --warn: #ea7968;
    --on-task: #0d1f17; --on-sub: #e5eee9; --st-arbeit-bg: #4a3512; --st-arbeit: #f3c77e;
  color-scheme: dark;
}
/* Eigene Farbwahl (Auto / Hell / Dunkel) hat Vorrang vor System und Umgebung */
:root[data-tp-theme="light"] { --bg: #f1f4f2; --surface: #ffffff; --ink: #16231d; --muted: #5a6a62; --line: #d3dbd6; --grid: #e4e9e6; --hdr: #e6ece8; --accent: #26664b; --accent-2: #7cc29c; --accent-ink: #ffffff; --accent-soft: #dcebe3; --sumrow: #e9f0ec; --sel: #e3efe8; --bar-sum: #1d3b2e; --bar-task: #3d7e5e; --bar-sub: #94c4aa; --bar-ms: #d4861b; --link: #b23a2b; --today: #1f6feb; --today-bg: #e2ecfb; --weekend: #eaeeec; --holiday: #f3dcd8; --warn: #b23a2b; --on-task: #ffffff; --on-sub: #16231d; --st-arbeit-bg: #fbe8c8; --st-arbeit: #7a4a06; color-scheme: light; }
:root[data-tp-theme="dark"] { --bg: #111916; --surface: #18221d; --ink: #e5eee9; --muted: #92a39a; --line: #2c3a33; --grid: #232f29; --hdr: #1d2924; --accent: #5db58d; --accent-2: #1f5a40; --accent-ink: #0d1f17; --accent-soft: #23372d; --sumrow: #1c2923; --sel: #223329; --bar-sum: #a9d9c0; --bar-task: #55a57c; --bar-sub: #2f6a50; --bar-ms: #e3a23a; --link: #ea7968; --today: #6aa6ff; --today-bg: #1e2c44; --weekend: #1d2823; --holiday: #3b2724; --warn: #ea7968; --on-task: #0d1f17; --on-sub: #e5eee9; --st-arbeit-bg: #4a3512; --st-arbeit: #f3c77e; color-scheme: dark; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font: 14px/1.4 var(--font-ui);
  display: flex; flex-direction: column; gap: 10px;
  padding-inline: 16px; padding-block: 12px;
  box-sizing: border-box;
}
*, *::before, *::after { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* Kopfleiste */
.top { display: flex; flex-direction: column; gap: 10px; flex: none; }
.row1, .row2 { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: flex-end; }
h1 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; }
.spacer { flex: 1 1 0; }
.settings { display: contents; }
.fld { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.fld > span, .fld > label {
  font-size: 11px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted);
}
.in {
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; min-width: 0;
}
.in:hover { border-color: var(--muted); }
#pname { width: min(200px, 70vw); font-weight: 500; }
.pj { display: flex; gap: 6px; }
#projSel { width: min(230px, 56vw); font-weight: 500; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 6px 11px; cursor: pointer; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 500; }
.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 6px 12px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 500; }
.btn.primary:hover { filter: brightness(1.08); }
.btn:disabled { opacity: 0.45; cursor: default; }
.chk { display: inline-flex; align-items: center; gap: 7px; padding: 6px 2px; cursor: pointer; }
.chk input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
.status { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; padding-bottom: 8px; }
.online{display:inline-flex;gap:4px;padding-bottom:8px}.online:empty{display:none}.chip{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;background:var(--c,var(--muted));color:#fff;opacity:.55;border:2px solid transparent}.chip.here{opacity:1;border-color:var(--bar-task)}.last{font-size:12px;color:var(--muted);padding-bottom:8px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.status[data-k="saved"] i { background: var(--bar-task); }
.status[data-k="saving"] i { background: var(--bar-ms); }
.status[data-k="error"] i { background: var(--warn); }
.banner {
  flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 8px 12px;
  background: var(--accent-soft); border-radius: 6px; font-size: 13px;
}

/* Arbeitsfläche */
.tabs { display: none; flex: none; }
.board { flex: 1 1 0; min-height: 320px; display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.pane.left { width: var(--leftw); flex: none; }
.pane.right { flex: 1 1 0; }
.hdr { flex: none; height: var(--headh); overflow: hidden; background: var(--hdr); border-bottom: 1px solid var(--line); }
.body { flex: 1 1 0; min-height: 0; overflow: auto; position: relative; }
.pane.left .body::-webkit-scrollbar { width: 0; height: 10px; }
.split { flex: none; width: 7px; background: var(--hdr); border-inline: 1px solid var(--line); cursor: col-resize; touch-action: none; }
.split:hover, .split:focus-visible { background: var(--accent-soft); }

.grid { display: grid; grid-template-columns: 52px 34px 42px 134px 220px 112px 80px 150px 62px 58px 130px 56px 98px 98px; width: 1326px; align-items: center; }
.hrow { height: var(--headh); font-size: 11px; font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
.hrow > div { padding: 0 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row { height: var(--rowh); border-bottom: 1px solid var(--grid); position: relative; }
.row > div { min-width: 0; padding: 0 2px; }
.row .num { font-family: var(--font-num); font-size: 12px; color: var(--muted); text-align: center; }
.row .calc { font-family: var(--font-num); font-size: 12px; padding-inline: 6px; white-space: nowrap; }
.row input, .row select {
  width: 100%; background: transparent; border: 1px solid transparent; border-radius: 4px; padding: 4px 5px; height: 28px; text-overflow: ellipsis;
}
.row input:hover, .row select:hover { border-color: var(--line); }
.row input:focus, .row select:focus { background: var(--surface); border-color: var(--accent); outline: none; }
.row input:disabled, .row select:disabled { opacity: 0.35; cursor: default; background: transparent; border-color: transparent; }
.who-picker-btn { display: flex; align-items: center; gap: 3px; width: 100%; min-width: 0; height: 28px; padding: 2px 4px; border: 1px solid transparent; border-radius: 4px; background: transparent; color: var(--ink); cursor: pointer; }
.who-picker-btn:hover, .who-picker-btn[aria-expanded="true"] { border-color: var(--line); background: var(--surface); }
.who-initials { display: inline-flex; flex: none; align-items: center; justify-content: center; min-width: 24px; height: 22px; padding: 0 4px; border-radius: 5px; background: var(--accent-soft); color: var(--accent); font-size: 10px; font-weight: 600; line-height: 1; }
.who-more, .who-empty { color: var(--muted); font-size: 11px; white-space: nowrap; }
.who-caret { margin-left: auto; color: var(--muted); font-size: 10px; }
.people-picker { box-sizing: border-box; position: fixed; z-index: 35; display: flex; flex-direction: column; width: 340px; max-width: calc(100vw - 16px); max-height: min(440px, calc(100dvh - 16px)); padding: 12px; gap: 9px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); color: var(--ink); box-shadow: 0 10px 32px rgba(0, 0, 0, .2); overflow: hidden; }
.people-picker[hidden] { display: none; }
.people-picker-head { display: flex; flex: none; align-items: center; justify-content: space-between; gap: 10px; }
.people-picker-head h2 { margin: 0; font-size: 14px; font-weight: 600; }
.people-picker-head .btn { padding: 4px 7px; font-size: 11px; }
.people-picker-row { flex: none; margin: 0; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; max-height: 36px; overflow: auto; }
.people-picker-search { display: flex; flex: none; flex-direction: column; gap: 4px; }
.people-picker-search label { font-size: 11px; color: var(--muted); }
.people-picker-search .in { width: 100%; min-width: 0; }
.people-picker-hint { flex: none; margin: 0; color: var(--muted); font-size: 11px; }
.people-picker-options { min-height: 0; overflow: auto; overscroll-behavior: contain; }
.people-picker-group { min-width: 0; padding: 0; margin: 0 0 10px; border: 0; }
.people-picker-group:last-child { margin-bottom: 0; }
.people-picker-group legend { padding: 0 0 4px; font-size: 11px; font-weight: 600; color: var(--muted); }
.people-picker-option { display: flex; align-items: flex-start; gap: 9px; padding: 8px 6px; border-radius: 5px; cursor: pointer; }
.people-picker-option:hover, .people-picker-option:focus-within { background: var(--sel); }
.people-picker-option input { flex: none; width: 16px; height: 16px; margin: 2px 0 0; accent-color: var(--accent); }
.people-picker-option input:disabled { opacity: .65; }
.people-picker-name { min-width: 0; font-size: 13px; overflow-wrap: anywhere; }
.people-picker-name small { display: block; margin-top: 2px; color: var(--muted); font-size: 10px; }
.people-picker-empty { margin: 8px 0; font-size: 12px; color: var(--muted); }
.people-picker-status { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
.row.sum { background: var(--sumrow); }
.row.sum input[data-f="name"], .row.sum .calc { font-weight: 600; }
.row.sel { background: var(--sel); }
.row.sub .nm { position: relative; }
.row.sub .nm input { padding-left: 24px; }
.row.sub .nm::before { content: ""; position: absolute; left: 12px; top: -10px; width: 9px; height: 24px; border-left: 1.5px solid var(--line); border-bottom: 1.5px solid var(--line); border-bottom-left-radius: 4px; pointer-events: none; }
.row.err .calc { color: var(--warn); }
.row .acts { display: flex; gap: 0; padding-left: 4px; }
.ib { width: 20px; height: 28px; display: grid; place-items: center; border: 0; background: transparent; border-radius: 4px; color: var(--muted); cursor: pointer; padding: 0; }
.ib:hover { background: var(--grid); color: var(--ink); }
.ib.del:hover { color: var(--warn); }
.ib svg { width: 14px; height: 14px; }
.empty { padding: 36px 24px; color: var(--muted); max-width: 46ch; }
.empty b { color: var(--ink); }

/* Zeitachse */
.chart svg { display: block; }
.g-weekend { fill: var(--weekend); }
.g-holiday { fill: var(--holiday); }
.g-todaybg { fill: var(--today-bg); }
.g-sel { fill: var(--sel); }
.g-v { stroke: var(--grid); stroke-width: 1; }
.g-vw { stroke: var(--line); stroke-width: 1; }
.g-h { stroke: var(--grid); stroke-width: 1; }
.g-today { stroke: var(--today); stroke-width: 1.5; stroke-dasharray: 4 3; }
.hd { font-family: var(--font-num); font-size: 10.5px; fill: var(--muted); }
.hd.strong { font-family: var(--font-ui); font-size: 11.5px; font-weight: 600; fill: var(--ink); }
.hd.today { fill: var(--today); font-weight: 600; }
.h-line { stroke: var(--line); stroke-width: 1; }
.bar-sum { fill: var(--bar-sum); }
.bar-task { fill: var(--bar-task); }
.bar-sub { fill: var(--bar-sub); }
.bar-ms { fill: var(--bar-ms); }
.bar-prog { fill: var(--bar-sum); opacity: .42; }
.bar-sumprog { fill: var(--accent-2); }
.bar-err { fill: none; stroke: var(--warn); stroke-width: 1.5; stroke-dasharray: 3 2; }
.lbl { font-size: 11px; fill: var(--muted); }
.lbl.ms { fill: var(--ink); }
.link { fill: none; stroke: var(--link); stroke-width: 1.3; opacity: 0.6; stroke-linejoin: round; }
.link.on { stroke-width: 2.2; opacity: 1; }
.arrow { fill: var(--link); opacity: 0.75; }
.arrow.on { opacity: 1; }
.hit { fill: transparent; cursor: pointer; }
.bars g { cursor: pointer; }

/* Fuß */
.foot { flex: none; display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; font-size: 12px; color: var(--muted); }
.lg { display: inline-flex; align-items: center; gap: 6px; }
.lg i { display: inline-block; width: 14px; height: 9px; border-radius: 2px; }
.lg i.d { width: 10px; height: 10px; transform: rotate(45deg); border-radius: 1px; }
.lg i.l { height: 0; border-top: 2px solid var(--link); border-radius: 0; width: 16px; }
.lg i.t { height: 0; border-top: 2px dashed var(--today); border-radius: 0; width: 16px; }
.foot .rels { margin-left: auto; font-family: var(--font-num); font-size: 11px; }

/* Dialog */
.scrim { position: fixed; inset: 0; background: rgba(8, 14, 11, 0.5); display: grid; place-items: center; padding: 16px; z-index: 20; }
#detScrim, #tkScrim { place-items: start center; padding-top: max(16px, 4vh); }   /* oben verankert: springt nicht, wenn Hinweise erscheinen oder verschwinden */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; width: min(640px, 100%); max-height: 100%; overflow: auto; padding: 18px 20px; display: flex; flex-direction: column; gap: 16px; }
.panel h2 { margin: 0; font-size: 17px; }
.panel h3 { margin: 0 0 6px; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.panel textarea { width: 100%; min-height: 110px; resize: vertical; font-family: var(--font-num); font-size: 12.5px; }
.panel .hint { font-size: 12px; color: var(--muted); margin: 4px 0 0; }
.panel .hint.bad { color: var(--warn); }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.panel .head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.toast { position: fixed; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 9px 12px; border-radius: 8px; display: flex; gap: 12px; align-items: center; z-index: 30; max-width: calc(100% - 32px); }
.toast button { background: transparent; border: 0; color: inherit; text-decoration: underline; cursor: pointer; padding: 0; font-weight: 600; }

/* Ansichten */
.viewbar { flex: none; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.filter-toggle { padding: 4px 8px; gap: 5px; min-height: 30px; font-size: 12px; color: var(--muted); }
.filter-toggle.active { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.filter-count { display: inline-flex; align-items: center; justify-content: center; min-width: 16px; padding: 0 4px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); font-size: 10px; line-height: 16px; }
.filter-summary { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.vfilters { flex: none; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); min-width: 0; }
.filter-field { display: flex; flex: 1 1 160px; flex-direction: column; gap: 3px; min-width: 0; max-width: 100%; }
.filter-field label { font-size: 11px; color: var(--muted); }
.filter-field.filter-search { flex-basis: 220px; flex-grow: 2; }
.vfilters .in { height: 32px; width: 100%; min-width: 0; max-width: 100%; }
.filter-reset { height: 32px; padding: 5px 10px; font-size: 12px; }
.vfilters[hidden], .filter-count[hidden], .filter-summary[hidden] { display: none; }
.vw { flex: 1 1 0; min-height: 320px; overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.bars g.done { opacity: 0.5; }
.stb { font-size: 12px; padding: 2px 8px 2px 18px; border-radius: 10px; white-space: nowrap; position: relative; background: color-mix(in srgb, var(--lc, var(--muted)) 16%, transparent); }
.stb::before { content: ""; position: absolute; left: 7px; top: 50%; width: 6px; height: 6px; margin-top: -3px; border-radius: 50%; background: var(--lc, var(--muted)); }
.st-offen { background: var(--grid); color: var(--muted); }
.st-arbeit { background: var(--st-arbeit-bg); color: var(--st-arbeit); }
.st-fertig { background: var(--accent-soft); color: var(--accent); }
.kcol .dot.st-offen { background: var(--muted); }
.kcol .dot.st-arbeit { background: var(--bar-ms); }
.kcol .dot.st-fertig { background: var(--bar-task); }
.msd { display: inline-block; width: 8px; height: 8px; background: var(--bar-ms); transform: rotate(45deg); margin-right: 7px; border-radius: 1px; flex: none; }
.late, .lt { color: var(--warn); }
.lt { font-size: 11px; font-weight: 600; }
/* Liste */
.tw { overflow-x: auto; }
.lst { border-collapse: collapse; width: 100%; min-width: 980px; font-size: 13px; }
.lst th { position: sticky; top: 0; background: var(--hdr); text-align: left; font-size: 11px; font-weight: 500; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding: 0; border-bottom: 1px solid var(--line); z-index: 1; }
.lst th button { all: unset; display: block; padding: 10px; cursor: pointer; white-space: nowrap; }
.lst th.on button { color: var(--ink); }
.lst td { padding: 5px 10px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
.lst td.n, .lst td.d { font-family: var(--font-num); font-size: 12px; }
.lst td.n { color: var(--muted); }
.lst tr.sum td { background: var(--sumrow); font-weight: 600; }
.lst tr.done td.nm .go { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.lst td.nm { white-space: normal; min-width: 220px; }
.lst td.ind { padding-left: 28px; }
.go { all: unset; cursor: pointer; display: inline-flex; align-items: center; }
.go:hover, .go:focus-visible { color: var(--accent); text-decoration: underline; }

/* Kanban */

.kb { display: grid; gap: 12px; height: 100%; align-items: stretch; }
.kcol { background: var(--hdr); border: 1px solid var(--line); border-radius: 8px; display: flex; flex-direction: column; min-height: 0; }

.lmb { width: 26px; font-size: 16px; }
.lmenu { margin: 0 10px 10px; padding: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; display: flex; flex-direction: column; gap: 8px; font-weight: 400; }

.card { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--bar-task); border-radius: 6px; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; cursor: grab; }

.cmeta { display: flex; justify-content: space-between; gap: 8px; font-family: var(--font-num); font-size: 11.5px; color: var(--muted); flex-wrap: wrap; }

/* Kalender */

.cal { min-width: 640px; }
.cwd { display: grid; grid-template-columns: repeat(7, 1fr); background: var(--hdr); border-bottom: 1px solid var(--line); }

.cb { all: unset; position: absolute; height: 18px; box-sizing: border-box; border-radius: 4px; padding: 0 6px; font-size: 11.5px; line-height: 18px; display: flex; align-items: center; overflow: hidden; cursor: pointer; z-index: 2; }

/* Team und Leserechte */

/* Benutzermenü */
.umenu-wrap { position: relative; }

.umenu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 25; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(0, 0, 0, .14); width: 230px; max-width: calc(100vw - 16px); padding: 6px; display: flex; flex-direction: column; }
.umenu button { all: unset; padding: 8px 10px; border-radius: 6px; cursor: pointer; font-size: 14px; overflow-wrap: anywhere; }
.umenu button:hover, .umenu button:focus-visible { background: var(--sel); }
/* Profil- und Ticket-Dialog */

.tk { gap: 12px; }
.prof > div { display: flex; flex-direction: column; gap: 8px; }

/* Fortschritt */
.pg { display: inline-flex; align-items: center; gap: 8px; min-width: 110px; }
.pgb { flex: 1 1 auto; height: 6px; border-radius: 3px; background: var(--grid); overflow: hidden; min-width: 60px; display: inline-block; }

.pcell { position: relative; }
.foot .disp { display: inline-flex; align-items: center; gap: 6px; margin-left: auto; }
.foot .disp + .disp { margin-left: 0; }
.foot:not([data-v="gantt"]) .lg, .foot:not([data-v="gantt"]) .rels { display: none; }
.foot .disp .seg button { padding: 2px 8px; font-size: 11.5px; }
.foot .disp + .rels { margin-left: 0; }
.pcell::after { content: ""; position: absolute; left: 4px; right: 4px; bottom: 2px; height: 3px; border-radius: 2px; pointer-events: none;
  background: linear-gradient(to right, var(--bar-task) var(--p, 0%), var(--grid) var(--p, 0%)); }
.pcell.full::after { background: var(--accent); }
.pstrip { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
.pst { all: unset; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px; min-width: 170px; flex: 1 1 170px; max-width: 280px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; }
.pst.all { cursor: default; border-color: var(--accent); }
.pst:hover:not(.all), .pst:focus-visible { border-color: var(--accent); }

.pst .pg { min-width: 0; }
#vList .pstrip { margin: 12px 12px 4px; }

.pgt { font-family: var(--font-num); font-size: 11.5px; color: var(--muted); min-width: 36px; text-align: right; }
.card .pg { display: flex; width: 100%; }
.card .pg .pgt { flex: none; }
.projprog.fin b { color: var(--accent); }
.projprog { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.projprog .pgb { width: 110px; height: 8px; border-radius: 4px; }
.projprog b { font-family: var(--font-num); color: var(--ink); font-size: 12.5px; min-width: 38px; }
/* Detail-Knopf in der Namenszelle */
.row .nm { position: relative; }
.row .nm input { padding-right: 30px; }
.ib.det { position: absolute; right: 2px; top: 3px; width: 26px; opacity: .35; }

.mk { display: inline-flex; align-items: center; gap: 2px; margin-left: 8px; font-size: 11px; color: var(--muted); font-weight: 400; }

.cdesc { font-size: 12.5px; color: var(--muted); white-space: pre-line; overflow-wrap: anywhere; }

/* Detailfenster */
.panel.det { width: min(720px, 100%); gap: 14px; }
.dh { display: flex; align-items: baseline; gap: 10px; min-width: 0; }

.dmeta { margin: -6px 0 0; font-size: 13px; color: var(--muted); }
.dgrid { display: grid; grid-template-columns: 1fr 200px; gap: 12px; }

.people { display: flex; flex-wrap: wrap; gap: 6px; min-height: 28px; align-items: center; }

.cmts { border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 10px; }

.clist { display: flex; flex-direction: column; gap: 10px; max-height: 320px; overflow: auto; }
.cm { display: flex; flex-direction: column; gap: 4px; }
.cmh { display: flex; align-items: center; gap: 8px; font-size: 13px; }

.cmb { font-size: 14px; padding: 8px 10px; background: var(--hdr); border-radius: 8px; overflow-wrap: anywhere; }

.mlist { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(0, 0, 0, .14); display: flex; flex-direction: column; min-width: 220px; padding: 4px; }

/* Mobile Darstellung: automatisch bei schmalem Bildschirm oder über „Darstellung: Mobil“ */

.setbox .settings { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: flex-end; }
/* Mobil auf einem breiten Bildschirm: schmale Spalte in der Mitte */
html.mf body { max-width: 480px; margin: 0 auto; min-height: 100vh; box-shadow: 0 0 0 1px var(--line); }

/* Aufgaben */
#vTasks { padding: 14px; }
.tk { display: flex; flex-direction: column; gap: 14px; max-width: 1100px; }
.tkbar { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
.tkbar #tkQ { width: 220px; max-width: 100%; }
.tksum { font-size: 12px; color: var(--muted); }
.tkbadge { display: inline-block; margin-left: 6px; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent-soft); color: var(--accent); font-size: 11px; line-height: 18px; font-weight: 600; text-align: center; }
.seg button[aria-pressed="true"] .tkbadge { background: var(--accent-ink); color: var(--accent); }
.tkbadge.late { background: var(--warn); color: #fff; }
.tkload { display: flex; flex-wrap: wrap; gap: 6px; }
.tkl { all: unset; box-sizing: border-box; display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 4px; border: 1px solid var(--line); border-radius: 16px; font-size: 12.5px; cursor: pointer; background: var(--surface); color: var(--ink); }
.tkl .nm { padding-left: 4px; }
.tkl b { font-family: var(--font-num); }
.tkl .lt { color: var(--warn); font-size: 11.5px; }
.tkl.on, .tkl:hover, .tkl:focus-visible { border-color: var(--accent); background: var(--accent-soft); }
.tkg { display: flex; flex-direction: column; gap: 6px; }
.tkg h3 { margin: 4px 0 2px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.tkg h3 span { font-family: var(--font-num); font-weight: 400; margin-left: 4px; }
.tki { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 4px 10px; align-items: start; padding: 10px 12px; border: 1px solid var(--line); border-left: 3px solid var(--line); border-radius: 8px; background: var(--surface); }
.tki.p-hoch { border-left-color: var(--warn); }
.tki.p-niedrig { border-left-color: var(--grid); }
.tki.late { box-shadow: inset 0 0 0 1px var(--warn); }
.tki.done { opacity: .62; }
.tki.done .tkt { text-decoration: line-through; }
.tkchk { position: relative; width: 22px; height: 22px; margin-top: 1px; cursor: pointer; }
.tkchk input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.tkchk span { position: absolute; inset: 0; pointer-events: none; border: 2px solid var(--muted); border-radius: 50%; }
.tkchk input:checked + span { background: var(--accent); border-color: var(--accent); }
.tkchk input:checked + span::after { content: "✓"; position: absolute; inset: 0; color: var(--accent-ink); font-size: 13px; line-height: 18px; text-align: center; font-weight: 700; }
.tkchk input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.tkmain { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.tkt { all: unset; cursor: pointer; font-weight: 600; color: var(--ink); overflow-wrap: anywhere; }
.tkt:hover, .tkt:focus-visible { color: var(--accent); text-decoration: underline; }
.tkd { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.tkm { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; color: var(--muted); align-items: center; }
.tkp { padding: 0 6px; border-radius: 4px; font-size: 11px; line-height: 17px; background: var(--grid); color: var(--ink); }
.tkp.hoch { background: var(--warn); color: #fff; }
.tkdue { font-family: var(--font-num); }
.tkdue.late { color: var(--warn); font-weight: 600; }
.tkrow { all: unset; cursor: pointer; color: var(--accent); }
.tkrow:hover, .tkrow:focus-visible { text-decoration: underline; }
.tkwho { display: flex; flex-wrap: wrap; gap: 4px 8px; justify-content: flex-end; max-width: 300px; font-size: 12.5px; }
.tkper { display: inline-flex; align-items: center; gap: 5px; }
